<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1530" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Crowned Daily</title>
  <script>
    // Apply the saved theme before first paint so the page never flashes the wrong one.
    try {
      const theme = JSON.parse(localStorage.getItem("theme"));
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Soft moving color fields that the glass panels blur -->
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-gold"></span>
    <span class="orb orb-plum"></span>
    <span class="orb orb-clay"></span>
    <span class="orb orb-rose"></span>
  </div>

  <main class="app">
    <header class="topbar glass">
      <div>
        <p class="eyebrow" id="today-date"></p>
        <h1 class="greeting" id="greeting">Good morning, Queen</h1>
      </div>
      <button class="icon-btn glass-btn" id="name-btn" aria-label="Set your name">
        <span id="avatar-initial">♛</span>
      </button>
    </header>

    <section class="hero glass" aria-live="polite">
      <div class="hero-meta">
        <span class="chip" id="theme-chip">Confidence</span>
        <span class="streak" id="streak" title="Daily streak"></span>
      </div>
      <blockquote class="affirmation" id="affirmation"></blockquote>
      <div class="actions">
        <button class="glass-btn" id="fav-btn" aria-pressed="false" aria-label="Save to favorites">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3.1 4.5 6.9 4.5c2.1 0 3.6 1.2 5.1 3 1.5-1.8 3-3 5.1-3 3.8 0 6 3.8 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>
          <span>Save</span>
        </button>
        <button class="glass-btn" id="share-btn" aria-label="Share affirmation">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
          <span>Share</span>
        </button>
        <button class="glass-btn primary" id="next-btn" aria-label="Show another affirmation">
          <svg viewBox="0 0 24 24" class="icon"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
          <span>Another</span>
        </button>
      </div>
    </section>

    <nav class="segmented glass" id="themes" aria-label="Filter by theme"></nav>

    <section class="favorites glass">
      <div class="section-head">
        <h2>Your saved affirmations</h2>
        <span class="count" id="fav-count">0</span>
      </div>
      <ul id="fav-list" class="fav-list"></ul>
      <p class="empty" id="fav-empty">Tap <strong>Save</strong> on any affirmation to keep it here.</p>
    </section>

    <section class="appearance glass">
      <h2>Appearance</h2>
      <div class="segmented" id="theme-picker" role="group" aria-label="Appearance">
        <button class="segment" data-theme-option="system">
          <svg viewBox="0 0 24 24" class="icon"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
          System
        </button>
        <button class="segment" data-theme-option="light">
          <svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Light
        </button>
        <button class="segment" data-theme-option="dark">
          <svg viewBox="0 0 24 24" class="icon"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          Dark
        </button>
      </div>
    </section>

    <footer class="foot">Speak it. Believe it. Build it.</footer>
  </main>

  <div class="toast glass" id="toast" role="status"></div>

  <dialog class="sheet glass" id="name-dialog">
    <form method="dialog">
      <h2>What should we call you?</h2>
      <input id="name-input" type="text" maxlength="24" placeholder="Your first name" autocomplete="given-name" />
      <div class="sheet-actions">
        <button value="cancel" class="glass-btn">Cancel</button>
        <button value="save" class="glass-btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="affirmations.js"></script>
  <script src="app.js"></script>
</body>
</html>
